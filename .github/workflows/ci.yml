name: CI Tests & Batch Verification

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Automated Unit & Integration Tests (19 tests)
        run: python test_suite.py

      - name: Run Official Batch Tests (10 Test Cases)
        run: python solution.py --run-all-tests

      - name: Run Simulation on Standard Input
        run: python solution.py data.json --delays --midday-agent
